<!DOCTYPE html>
<html lang='en' translate="no">
<head>
    <meta charset='UTF-8', Content-Type: text/plain; charset=utf-8='notranslate'>
    <title>aInfo</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
    <!-- black navigation, Chrome, Android  -->
    <meta name="theme-color" content="#000000">
    <!-- black navigation Safari iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <!-- black navigation Windows / Edge -->
    <meta name="msapplication-navbutton-color" content="#000000">
    
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="img/FaviconWhite32.png">
    <link rel="apple-touch-icon" href="img/FaviconWhite180.png">
    <link rel="icon" href="img/FaviconBlack32.png">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- flatpickr for date -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>  

</head>
<body>
<div class='container py-3 py-md-5'>
    <div class='row justify-content-center'>
        <div class='col-lg-8'>
            <div class='card shadow-sm'>
                <div class='card-body'>
                    <header class="header">
                      <img src="img/LogoWhite.png" class="logo" alt="abroadInfo">
                    </header>

                    <!-- 
                    <h3 class='mb-4 text-center'>abroadInfo</h3>
                    -->
                    
                    <!-- COUNTRIES -->
                    <div class='mb-3'>
                        <strong>Země/jazyk</strong>
                        <div id='btnCountry' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnCountryDescr"></small>
                    </div>

                    <!-- INPUT -->
                    <div class='mb-3'>
                        <div class="d-flex justify-content-between align-items-center">
                    <label for="searchedText" class="form-label mb-0">
                        <strong>Vyhledej:</strong>
                    </label>

                    <a href="#" onclick="fTextAreaClear(); return false;">
                        Vymaž
                    </a>
                    </div>
                        
                        <textarea id="searchedText" rows="1" placeholder="Vlož text, nebo nech volné, pokud je nastaven typ media"
                            lang="en"          autocapitalize="none"
                            autocomplete="off" autocorrect="off" style="overflow:hidden"
                            spellcheck="false">Česko</textarea>
                        <br>

                    <div class="d-flex align-items-center gap-3">
                    
                    <label class="form-label mb-0">
                        <strong>Přelož:</strong>
                    </label>

                    <div class="form-check form-switch mb-0 d-flex align-items-center">
                        
                        <input class="form-check-input me-2" type="radio" name="translLng" id="cs" value="cs">
                        <label class="radio-opt" for="en">z CS</label>
                    
                        <input class="form-check-input me-2" type="radio" name="translLng" id="en" value="en">
                        <label class="radio-opt" for="en">z EN</label>
                    
                        <input class="form-check-input me-2" type="radio" name="translLng" id="xx" value="xx">
                        <label class="radio-opt" for="xx">Nepřekládat</label>
                    </div>

                    </div>
                    <br>
                    
                    <!-- YEAR -->
                    <div class='mb-3'>
                        <strong>Časové období</strong>
                        <div id='btnTime' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnTimeDescr"></small>
                    </div>

                    <!-- Media -->
                    <div class='mb-3'>
                        <strong>Typ media</strong>
                        <div id='btnMedia' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnMediaDescr"></small>
                    </div>

                    <!-- Output -->
                    <div class='mb-3'>
                        <strong>Formát výstupu</strong>
                        <div id='btnOutput' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnOutputDescr"></small>
                    </div>
                    <!-- neprimy link -->
                    <div class='mb-3'>
                        <div id='lnk' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="lnkDescr"></small>   
                    </div>

            <!-- MOBILE SEARCH -->
            <div class='mobile-search d-md-none'>
                <!-- <button class='btn btn-secondary btn-sm' id='removeAll' onclick='removeAllStored()'>Smaž uživ. tlačítka</button> -->
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-google' onclick='runEngineQuery("mobile", "google")'>google</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-bing' onclick='runEngineQuery("mobile", "bing")'>bng</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-duckduckgo' onclick='runEngineQuery("mobile", "duckduckgo")'>ddg</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-yandex' onclick='runEngineQuery("mobile", "yandex")'>ynx</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-startpage' onclick='runEngineQuery("mobile", "startpage")'>stp</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-baid' onclick='runEngineQuery("mobile", "baidu")'>bdu</button>
            </div>

            <!-- DESKTOP SEARCH -->
            <div class='text-end mt-3 d-none d-md-block'>
                <button class='btn btn-secondary btn-sm' id='removeAll' onclick='removeAllStored()'>Smaž uživ. tlačítka</button>
                <button class='btn btn-success btn-lg' id='search-desktop-google' onclick='runEngineQuery("desktop", "google")'>Google</button>
                <button class='btn btn-success btn-lg' id='search-desktop-bing' onclick='runEngineQuery("desktop", "bing")'>Bing</button>
                <button class='btn btn-success btn-lg' id='search-desktop-duckduckgo' onclick='runEngineQuery("desktop", "duckduckgo")'>DuckDuckGo</button>
                <button class='btn btn-success btn-lg' id='search-desktop-yandex' onclick='runEngineQuery("desktop", "yandex")'>Yandex</button>
                <button class='btn btn-success btn-lg' id='search-desktop-startpage' onclick='runEngineQuery("desktop", "startpage")'>Startpage</button>
                <button class='btn btn-success btn-lg' id='search-desktop-baid' onclick='runEngineQuery("desktop", "baidu")'>Baidu</button>
            </div>
            

                        
            
        </div>
    </div>
        </div>
    </div>
</div>


<!-- JS -->
<script src="js/base.js" defer></script>
<script src="js/dialogs.js" defer></script>
<script src="js/customization.js" defer></script>
<script src="js/translateGoogle.js" defer></script>
<script src="js/app.js" defer></script>
  
</body>
</html>
