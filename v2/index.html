<!DOCTYPE html>
<html lang='en' translate="no">
<head>
    <meta charset='UTF-8', Content-Type: text/plain; charset=utf-8='notranslate'>
    <title>aInfo</title>
    <meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
    <!-- black navigation, Chrome, Android  -->
    <meta name="theme-color" content="#000000">
    <!-- black navigation Safari iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <!-- black navigation Windows / Edge -->
    <meta name="msapplication-navbutton-color" content="#000000">
    
    <link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="img/FaviconWhite32.png">
    <link rel="apple-touch-icon" href="img/FaviconWhite180.png">
    <link rel="icon" href="img/FaviconBlack32.png">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
<div class='container py-3 py-md-5'>
    <div class='row justify-content-center'>
        <div class='col-lg-8'>
            <div class='card shadow-sm'>
                <div class='card-body'>
                    <header class="header">
                      <img src="img/LogoWhite.png" class="logo" alt="abroadInfo">
                    </header>

                    <!-- 
                    <h3 class='mb-4 text-center'>abroadInfo</h3>
                    -->
                    

                    <!-- INPUT -->
                    <div class='mb-3'>
                        <!-- 
                        <input id='queryInput' type='text' class='form-control form-control-lg' placeholder='Enter search text...' value='Česko'>
                        -->
                        <strong>Vyhledej:</strong>
                        <p>
                        Pro zakázání určitého slova dej před něj mínus, pro synonymum dej před něj ~. Pro hledání přesné fráze použij uvozovky.
                        </p>
                        <textarea id="searchedText" rows="1" placeholder="Enter search text..."
                            lang="en"          autocapitalize="none"
                            autocomplete="off" autocorrect="off" style="overflow:hidden"
                            spellcheck="false">Česko</textarea>
                        <br>

                        <strong>Přelož:</strong>
                        
                        <div class='form-check form-switch mb-4'>
                            <label class="radio-opt">
                                <input type="radio" name="translLng" value="cs" class='form-check-input'>
                                    z CS
                            </label>
                            &nbsp
                            <label class="radio-opt">
                                <input type="radio" name="translLng" value="en" class='form-check-input'>
                                    z EN
                            </label>
                            <label class="radio-opt">
                                <input type="radio" name="translLng" value="xx" checked class='form-check-input'>
                                    Ne
                            </label>
                    </div>

                    

                    <!-- COUNTRIES -->
                    <div class='mb-3'>
                        <strong>Země/jazyk</strong>
                        <div id='btnCountry' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnCountryDescr"></small>
                    </div>

                    <!-- YEAR -->
                    <div class='mb-3'>
                        <strong>Časové období</strong>
                        <div id='btnTime' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnTimeDescr"></small>
                    </div>

                    <!-- Media -->
                    <div class='mb-3'>
                        <strong>Typ media</strong>
                        <div id='btnMedia' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnMediaDescr"></small>
                    </div>

                    <!-- Output -->
                    <div class='mb-3'>
                        <strong>Formát výstupu</strong>
                        <div id='btnOutput' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="btnOutputDescr"></small>
                    </div>
                    <!-- neprimy link -->
                    <div class='mb-3'>
                        <div id='lnk' class='d-flex flex-wrap gap-2 mt-2'></div>
                        <small id="lnkDescr"></small>   
                    </div>

            <!-- MOBILE SEARCH -->
            <div class='mobile-search d-md-none'>
                <!-- <button class='btn btn-secondary btn-sm' id='removeAll' onclick='removeAllStored()'>Smaž uživ. tlačítka</button> -->
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-google' onclick='openSearchEngine("mobile", "google")'>google</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-bing' onclick='openSearchEngine("mobile", "bing")'>bng</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-duckduckgo' onclick='openSearchEngine("mobile", "duckduckgo")'>ddg</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-yandex' onclick='openSearchEngine("mobile", "yandex")'>ynx</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-startpage' onclick='openSearchEngine("mobile", "startpage")'>stp</button>
                <button class='btn btn-success w-30 btn-sm' id='search-mobile-baid' onclick='openSearchEngine("mobile", "baidu")'>bdu</button>
            </div>

            <!-- DESKTOP SEARCH -->
            <div class='text-end mt-3 d-none d-md-block'>
                <button class='btn btn-secondary btn-sm' id='removeAll' onclick='removeAllStored()'>Smaž uživ. tlačítka</button>
                <button class='btn btn-success btn-lg' id='search-desktop-google' onclick='openSearchEngine("desktop", "google")'>Google</button>
                <button class='btn btn-success btn-lg' id='search-desktop-bing' onclick='openSearchEngine("desktop", "bing")'>Bing</button>
                <button class='btn btn-success btn-lg' id='search-desktop-duckduckgo' onclick='openSearchEngine("desktop", "duckduckgo")'>DuckDuckGo</button>
                <button class='btn btn-success btn-lg' id='search-desktop-yandex' onclick='openSearchEngine("desktop", "yandex")'>Yandex</button>
                <button class='btn btn-success btn-lg' id='search-desktop-startpage' onclick='openSearchEngine("desktop", "startpage")'>Startpage</button>
                <button class='btn btn-success btn-lg' id='search-desktop-baid' onclick='openSearchEngine("desktop", "baidu")'>Baidu</button>
            </div>
            

                        
            
        </div>
    </div>
        </div>
    </div>
</div>


<!-- JS -->
<script src="js/base.js" defer></script>
<script src="js/dialogs.js" defer></script>
<script src="js/customization.js" defer></script>
<script src="js/translateGoogle.js" defer></script>
<script src="js/app.js" defer></script>
  
</body>
</html>
